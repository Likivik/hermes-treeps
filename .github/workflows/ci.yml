name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: >-
          actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Lint
        run: ruff check --output-format=github .

  smoke:
    name: Plugin import — smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: >-
          actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Import the plugin the way the loader does
        run: python scripts/smoke_import.py

  tests:
    name: Tests — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: >-
          actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      # The prepare/jj test creates a real colocated repo and a workspace;
      # without jj it silently skips itself and CI stops guarding the
      # .git-dir resolution that makes prepare work in jj workspaces.
      - name: Install jujutsu
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.46.0/jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo install jj /usr/local/bin/jj
          jj --version
      - name: Run the test suite
        run: python -m pytest -q
