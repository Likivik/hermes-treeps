name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Lint
        run: ruff check --output-format=github .

  smoke:
    name: Plugin import — smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Import the plugin the way the loader does
        run: python scripts/smoke_import.py

  tests:
    name: Tests — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      # The suite is offline: no network, no Hermes install, no jj repo is
      # created (the one jj test skips itself when the binary is absent).
      - name: Run the test suite
        run: python -m pytest -q
