[pytest]
testpaths = tests
# WHY --confcutdir=tests: the plugin directory IS a Python package
# (``__init__.py`` beside ``store.py``) and its directory name
# (``hermes-treeps``) is not a valid Python identifier. pytest walks up from
# the collected path looking for ``__init__.py`` files to decide how to name
# the test module; left alone it reaches the plugin's own ``__init__.py``,
# tries to import THAT as the test package, and the plugin's
# ``from . import store`` fails with "attempted relative import with no known
# parent package" - the whole suite fails to collect before a single
# assertion runs.
#
# Stopping the walk at tests/ keeps pytest out of the plugin package
# entirely. The suite loads the plugin itself, by file location, the way the
# real loader does - see tests/plugin_loader.py.
addopts = --confcutdir=tests
# tests/ is not a package, so the shared loader module lives on the path.
pythonpath = tests
