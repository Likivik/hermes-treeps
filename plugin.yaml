name: hermes-treeps
version: 0.3.0
manifest_version: 2
api_version: 1
description: >
  One jj workspace per session, enforced. A session is either bound to a repo
  (its own workspace under /Git/hermes/workspaces/<repo>/<slug>) or explicitly
  "just chatting" (HERMES_HOME as cwd, full capabilities). Repo-touching tools
  are blocked until the session resolves one of the two, so a workspace can
  never be created without a session record, and a session can never quietly
  work in someone else's tree.
author: "Likivik"
license: MIT
homepage: https://github.com/Likivik/hermes-treeps
tags:
  - workspaces
  - vcs
  - sessions
kind: standalone
platforms:
  - linux
provides_tools:
  - ws_new
  - ws_chatting
  - ws_rename
  - ws_status
  - ws_doctor
  # ws_prepare lives in prepare.py and is registered through
  # prepare.register(ctx) in the plugin's register().
  - ws_prepare
provides_hooks:
  - pre_tool_call
  - on_session_start
  - on_session_reset
  - on_session_finalize
  # The host's dedicated subagent lifecycle hooks. The child-end report is
  # built from these: subagent_start maps the child to its parent, and
  # subagent_stop hands the child's workspace state to the parent.
  - subagent_start
  - subagent_stop
  # The per-turn channel that delivers a parent's pending child-end report on
  # its next turn (plugin system-prompt sections are frozen per session, so
  # they cannot carry a report about a child that finishes later).
  - pre_llm_call
# Every key the plugin reads is declared here, so the Desktop settings form
# and the code cannot drift apart. The test suite asserts that this set is
# exactly the set settings() reads.
config_schema:
  repo_dir:
    type: str
    default: /Git/hermes
    description: >-
      The repo directory. Session workspaces live in its .workspaces/ dot-dir
      (<repo_dir>/.workspaces/<repo>/<slug>).
  workspace_root:
    type: str
    default: /Git/hermes/workspaces
    description: >-
      DEPRECATED. The workspace root is derived from repo_dir now
      (<repo_dir>/.workspaces). Still parsed, but it no longer decides where
      workspaces go - move existing ones with `hermes ws migrate`.
  repo_roots:
    type: list
    default: [/Git, /Git/hermes, /Git/likivik, /Git/repos]
    description: >-
      DEPRECATED. Directories scanned for local repos. Repo discovery
      follows repo_dir now; this list is still read for this release.
  clone_root:
    type: str
    default: /Git/hermes
    description: Where a new repo is created or cloned.
  repo_sources:
    type: list
    default: [local, github, forgejo]
    description: Which remote catalogues the picker consults (local, github, forgejo).
  vcs:
    type: str
    default: auto
    description: Which VCS to use for new workspaces - auto (follow the repo), jj or git.
  extra_bin_dirs:
    type: list
    default: [/run/current-system/sw/bin, /usr/local/bin, /usr/bin]
    description: Extra PATH entries for gh, jj and git.
  picker_enabled:
    type: bool
    default: true
    description: Show the Telegram repo picker keyboard on /new.
  allowed_user_ids:
    type: list
    default: []
    description: Telegram user ids allowed to tap the picker (empty means open to everyone).
  forgejo_url:
    type: str
    default: ""
    description: Base URL of the Forgejo instance to search for repos.
  forgejo_token:
    type: secret
    # The .env name this secret lives under. Without it the host derives
    # HERMES_TREEPS_FORGEJO_TOKEN for the Desktop field while the plugin reads
    # FORGEJO_TOKEN - the two never met and the token was always empty.
    env: FORGEJO_TOKEN
    description: Forgejo API token (stored in .env, never in config.yaml).
  prepare_enabled:
    type: bool
    default: true
    description: Run the workspace prepare step (copy files, run the prepare command).
  prepare_command:
    type: str
    default: ""
    description: >-
      Shell command run with `bash -lc` inside the new workspace (empty means none).
      Operator-configured; it runs arbitrary code by design.
  prepare_files:
    type: list
    default: [".env"]
    description: Repo-relative files copied into the new workspace when they exist.
  prepare_timeout_seconds:
    type: int
    default: 300
    description: Hard ceiling (1-3600 seconds) on the prepare command.
